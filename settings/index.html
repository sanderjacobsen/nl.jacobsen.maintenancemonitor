<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
  <script type="text/javascript" src="./wizard.js"></script>
  <style>
    /* Only layout; colours, fonts, buttons and form fields come from Homey's own styleguide (homey.css). */
    .hidden { display: none !important; }
    .ha-icon { display: block; flex: 0 0 auto; width: 40px; height: 40px; background-color: var(--homey-color-mono-90);
      -webkit-mask: var(--icon) left center / contain no-repeat; mask: var(--icon) left center / contain no-repeat; }
    /* Homey's styleguide has no date field: give it the same look as its other inputs. */
    input.homey-form-input[type='date'] { all: unset; display: block; box-sizing: border-box; width: calc(100% - 2px); margin: 0 1px;
      background: var(--homey-color-component); padding: var(--homey-su-1); border-radius: var(--homey-border-radius-small);
      font-size: var(--homey-font-size-default); line-height: 24px; color: var(--homey-color-text); box-shadow: 0 0 0 1px var(--homey-color-line); }
    .ha-section { font-size: var(--homey-font-size-small); color: var(--homey-color-text-light); margin: var(--homey-su-3) 2px var(--homey-su-1); }
    .ha-card { background: var(--homey-color-component); border-radius: var(--homey-border-radius); box-shadow: var(--homey-box-shadow-light); margin-bottom: 12px; overflow: hidden; }
    .ha-pad { padding: 12px 14px; }
    .ha-sub { font-size: var(--homey-font-size-small); color: var(--homey-color-text-light); line-height: 20px; }

    .ha-head { display: flex; align-items: center; gap: 12px; padding: 14px; }
    .ha-head .ha-icon { width: 44px; height: 44px; }
    .ha-head .name { font-size: var(--homey-font-size-medium); font-weight: var(--homey-font-weight-medium); line-height: 26px; }
    .ha-head .ha-state { margin-left: auto; }

    .ha-grid3 { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: center; }
    .ha-grid2 { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
    .ha-grid3 .homey-form-select, .ha-grid2 .homey-form-select { width: calc(100% - 2px); }

    .ha-task { padding: 12px 14px; border-top: 1px solid var(--homey-color-line); }
    .ha-task .line { display: flex; align-items: flex-start; gap: 10px; }
    .ha-task .title { font-weight: var(--homey-font-weight-medium); flex: 1; min-width: 0; padding-top: 2px; }
    .ha-task .meta { font-size: var(--homey-font-size-small); color: var(--homey-color-text-light); line-height: 20px; margin-top: 2px; }
    .ha-bar { height: 4px; border-radius: 2px; background: var(--homey-color-mono-05); margin-top: 6px; overflow: hidden; }
    .ha-bar span { display: block; height: 100%; background: var(--homey-color-blue); }
    .ha-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .ha-actions .ha-right { margin-left: auto; }

    /* status icons (instead of text) */
    .ha-state { width: 24px; height: 24px; flex: 0 0 auto; }
    .ha-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 10px 14px; }
    .ha-legend span { display: inline-flex; align-items: center; gap: 6px; font-size: var(--homey-font-size-small); color: var(--homey-color-text-light); }
    .ha-legend .ha-state { width: 18px; height: 18px; }

    .ha-editor .homey-form-label { margin-top: 14px; }
    .ha-inline { display: grid; grid-template-columns: 90px 1fr; gap: 10px; align-items: center; }
    .ha-inline.days { grid-template-columns: 90px auto; justify-content: start; }
    .ha-inline span { color: var(--homey-color-text-light); }
    .ha-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--homey-color-line); }
    .ha-row:first-child { border-top: none; }
    .ha-row .homey-form-checkbox { margin: 0; }
    .ha-row .homey-form-input { width: 80px !important; }

    /* ---- wizard ---- */

  /* Only layout; colours, fonts, buttons and form fields come from Homey's own styleguide (homey.css). */
  .ha { padding-bottom: 88px; }
  .wz-progress { display: flex; gap: 6px; margin-bottom: var(--homey-su-1); }
  .wz-progress span { flex: 1; height: 4px; border-radius: 2px; background: var(--homey-color-mono-05); }
  .wz-progress span.on { background: var(--homey-color-blue); }
  .wz-step { font-size: var(--homey-font-size-small); color: var(--homey-color-text-light); }
  .ha .homey-title { margin-top: 2px; }
  .wz-hint { font-size: var(--homey-font-size-small); color: var(--homey-color-text-light); margin: 6px 0 0; line-height: 20px; }
  
  .wz-icon { display: block; flex: 0 0 auto; width: 40px; height: 40px; background-color: var(--homey-color-mono-90);
    -webkit-mask: var(--icon) left center / contain no-repeat; mask: var(--icon) left center / contain no-repeat; }
  /* Homey's styleguide has no date field: give it the same look as its other inputs. */
  input.homey-form-input[type='date'] { all: unset; display: block; box-sizing: border-box; width: calc(100% - 2px); margin: 0 1px;
    background: var(--homey-color-component); padding: var(--homey-su-1); border-radius: var(--homey-border-radius-small);
    font-size: var(--homey-font-size-default); line-height: 24px; color: var(--homey-color-text); box-shadow: 0 0 0 1px var(--homey-color-line); }

  /* Step 1: tiles like Homey's device tiles */
  .wz-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; margin-top: var(--homey-su-2); }
  .wz-tile { background: var(--homey-color-component); border-radius: var(--homey-border-radius); box-shadow: var(--homey-box-shadow-light);
    padding: 10px; aspect-ratio: 1 / 1; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer;
    -webkit-tap-highlight-color: transparent; transition: box-shadow var(--homey-duration-fast); }
  .wz-tile .name { font-size: var(--homey-font-size-small); line-height: 18px; color: var(--homey-color-text); hyphens: manual; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .wz-tile.sel { box-shadow: 0 0 0 2px var(--homey-color-blue), var(--homey-box-shadow-light); }

  .wz-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* Step 3: one card per task */
  .wz-task { background: var(--homey-color-component); border-radius: var(--homey-border-radius); box-shadow: var(--homey-box-shadow-light);
    padding: 12px 14px; margin-top: 12px; }
  .wz-task.off .wz-sum { opacity: .5; }
  .wz-task .homey-form-checkbox { margin: 0; }
  .wz-task .homey-form-checkbox-text { font-weight: var(--homey-font-weight-medium); }
  .wz-sum { font-size: var(--homey-font-size-small); color: var(--homey-color-text-light); line-height: 20px; margin: 4px 0 0; }
  .wz-task .wz-edit-btn { margin-top: 8px; }
  .wz-task .homey-form-label { margin-top: 14px; }
  .wz-inline { display: grid; grid-template-columns: 90px 1fr; gap: 10px; align-items: center; }
  .wz-inline.days { grid-template-columns: 90px auto; justify-content: start; }
  .wz-inline span { color: var(--homey-color-text-light); }
  .wz-remove { margin-top: 12px; }
  #addCustom { margin-top: 14px; }

  /* Step 4 */
  .wz-card { background: var(--homey-color-component); border-radius: var(--homey-border-radius); box-shadow: var(--homey-box-shadow-light); margin-top: 12px; overflow: hidden; }
  .wz-head { display: flex; align-items: center; gap: 12px; padding: 14px; }
  .wz-head .wz-icon { width: 44px; height: 44px; }
  .wz-head .name { font-size: var(--homey-font-size-medium); font-weight: var(--homey-font-weight-medium); line-height: 26px; }
  .wz-line { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--homey-color-line); }
  .wz-line .t { font-weight: var(--homey-font-weight-medium); }
  .wz-line .s { font-size: var(--homey-font-size-small); color: var(--homey-color-text-light); }
  .wz-line .r { text-align: end; font-size: var(--homey-font-size-small); color: var(--homey-color-text-light); white-space: nowrap; }
  .wz-line .r b { display: block; font-weight: var(--homey-font-weight-medium); color: var(--homey-color-text); }
  .wz-line .r b.now { color: #e07b00; }

  /* Bottom navigation, like Homey's own pair screens */
  .wz-nav { position: fixed; z-index: 10; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: 1fr 2fr; gap: 8px;
    padding: 12px var(--homey-su-2) calc(12px + env(safe-area-inset-bottom)); background: var(--homey-color-component); }

    .wz { padding-bottom: 96px; }
  </style>
</head>
<body>
  <div id="wizard" class="hidden"></div>
  <div id="main">
  <h1 class="homey-title" data-i18n="settings.title"></h1>
  <p class="homey-subtitle" data-i18n="settings.intro"></p>

  <div class="ha-section" data-i18n="settings.items"></div>
  <input class="homey-form-input" type="text" inputmode="search" enterkeyhint="search" id="search" autocomplete="off" style="margin-bottom:12px" />
  <button class="homey-button-primary-shadow-full" id="addItem" style="margin-bottom:12px">+ <span data-i18n="settings.add_item"></span></button>
  <div id="items"></div>

  <div class="ha-section" data-i18n="settings.notifications"></div>
  <div class="ha-card">
    <div class="ha-row"><label class="homey-form-checkbox"><input class="homey-form-checkbox-input" type="checkbox" id="notify_soon" /><span class="homey-form-checkbox-checkmark"></span><span class="homey-form-checkbox-text" data-i18n="settings.notify_soon"></span></label></div>
    <div class="ha-row"><label class="homey-form-checkbox"><input class="homey-form-checkbox-input" type="checkbox" id="notify_due" /><span class="homey-form-checkbox-checkmark"></span><span class="homey-form-checkbox-text" data-i18n="settings.notify_due"></span></label></div>
    <div class="ha-row"><label class="homey-form-checkbox"><input class="homey-form-checkbox-input" type="checkbox" id="notify_overdue" /><span class="homey-form-checkbox-checkmark"></span><span class="homey-form-checkbox-text" data-i18n="settings.notify_overdue"></span></label></div>
    <div class="ha-row"><span data-i18n="settings.overdue_after"></span><input class="homey-form-input" type="number" inputmode="numeric" id="overdue_after_days" min="1" max="365" /></div>
  </div>

  <div class="ha-section" data-i18n="settings.backup"></div>
  <div class="ha-card ha-pad">
    <p class="ha-sub" data-i18n="settings.import_hint"></p>
    <textarea class="homey-form-textarea" id="backup" rows="5"></textarea>
    <div class="ha-actions">
      <button class="homey-button-secondary-small-shadow" id="export" data-i18n="settings.export"></button>
      <button class="homey-button-secondary-small-shadow" id="import" data-i18n="settings.import"></button>
    </div>
  </div>
  </div>

<script>
  let H; let items = []; let templates = []; let homeyDevices = null;
  let editing = null; // { itemId, taskId | 'new', draft }
  let query = ''; // search text
  const openSettings = new Set(); // items whose settings block is open
  const UNITS = ['days', 'weeks', 'months', 'years'];
  const ORDER = ['ok', 'soon', 'due', 'overdue'];
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const t = (key, vars) => H.__(key, vars);
  const pad = n => String(n).padStart(2, '0');
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const fmt = (date, opts) => new Date(`${date}T12:00:00`).toLocaleDateString(undefined, opts || { day: 'numeric', month: 'short', year: 'numeric' });
  const api = (method, path, body) => new Promise((resolve, reject) => H.api(method, path, body || null, (err, res) => (err ? reject(err) : resolve(res))));
  const icon = uri => `<span class="ha-icon" style="--icon:url('${uri}')"></span>`;
  const round = n => Math.round((Number(n) || 0) * 10) / 10;
  const everyText = (n, unit, lower) => {
    const txt = Number(n) === 1 ? t('pair.every_one.' + unit) : `${t('pair.every')} ${n} ${t('pair.units.' + unit)}`;
    return lower ? txt.charAt(0).toLowerCase() + txt.slice(1) : txt;
  };

  // Status icons: round badges in Homey's colours.
  const STATE_ICON = {
    ok: '<circle cx="12" cy="12" r="11" fill="#3fc700"/><path d="m7 12.3 3.2 3.2L17 8.7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>',
    soon: '<circle cx="12" cy="12" r="11" fill="#f5a623"/><path d="M12 6.8V12l3.4 2.2" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>',
    due: '<circle cx="12" cy="12" r="11" fill="#ff7a00"/><path d="M12 6.5v7" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="17.2" r="1.4" fill="#fff"/>',
    overdue: '<circle cx="12" cy="12" r="11" fill="#d81c1d"/><path d="M12 6.5v7" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="17.2" r="1.4" fill="#fff"/>',
  };
  const stateIcon = status => `<svg class="ha-state" viewBox="0 0 24 24" role="img" aria-label="${esc(t('status.' + status))}"><title>${esc(t('status.' + status))}</title>${STATE_ICON[status]}</svg>`;

  // ---------- linked devices ----------
  const linkedDevice = item => (item.link && homeyDevices ? homeyDevices.find(d => d.id === item.link.id) || null : null);
  const capOf = (dev, id) => (dev ? dev.capabilities.find(c => c.id === id) : null);

  function usageUnit(task, dev) {
    const metric = task.metric || (task.source && task.source.metric) || 'hours';
    if (metric === 'hours') return t('usage.unit_hours');
    if (metric === 'cycles') return t('usage.unit_cycles');
    const capId = task.srcCap || (task.source && task.source.capability);
    const c = capOf(dev, capId);
    return (c && c.units) || (task.source && task.source.units) || '';
  }

  function autoSource(dev, metric, watts) {
    const sug = dev && dev.suggest && dev.suggest[metric];
    if (!sug || !sug.kind) return { metric, srcCap: '', op: 'true', cmpValue: '' };
    return {
      metric: sug.metric, srcCap: sug.srcCap, op: sug.op, cmpValue: sug.kind === 'power' ? (watts || sug.cmpValue) : sug.cmpValue, auto: true, offDelayMin: sug.offDelayMin ?? 3, minRunMin: sug.minRunMin ?? 1,
    };
  }

  function describeSource(d, dev) {
    const c = capOf(dev, d.srcCap);
    if (!c) return '';
    if ((d.metric || 'hours') === 'counter') return t('usage.desc_counter', { cap: c.title });
    let cond = t('usage.is_on');
    if (d.op === 'gt') cond = `${t('usage.greater_than')} ${d.cmpValue} ${c.units || ''}`.trim();
    if (d.op === 'equals') {
      const v = (c.values || []).find(x => String(x.id) === String(d.cmpValue));
      cond = `${t('usage.equals')} '${v ? v.title : d.cmpValue}'`;
    }
    return t('usage.desc_running', { cap: c.title, cond });
  }


  // ---------- texts ----------
  function metaText(task, dev) {
    if (task.type === 'counter' || task.type === 'usage') {
      const what = task.type === 'counter' ? t('settings.type_counter') : t('usage.metric_' + ((task.source && task.source.metric) || 'hours'));
      const unit = task.type === 'usage' ? ` ${usageUnit(task, dev)}` : '';
      let txt = `${what}: ${round(task.type === 'counter' ? task.counter : task.usage)} / ${task.threshold}${unit} (${Math.round((task.progress || 0) * 100)}%)`;
      if (task.type === 'usage' && task.combine && task.dueDate) txt += ` · ${t('usage.or_date')}: ${fmt(task.dueDate)}`;
      return txt;
    }
    const d = task.days;
    const when = d > 0 ? t('device.in_days', { days: d }) : d === 0 ? t('device.today') : t('device.days_late', { days: -d });
    return `${everyText(task.every, task.unit)} · ${t('settings.last_done').toLowerCase()} ${fmt(task.lastDone)} · ${t('settings.next').toLowerCase()} ${fmt(task.dueDate)} (${when})`;
  }

  // ---------- item rows ----------
  function installRow(item) {
    const y = item.installDate ? item.installDate.slice(0, 4) : '';
    const m = item.installDate ? item.installDate.slice(5, 7) : '';
    const thisYear = new Date().getFullYear();
    const years = Array.from({ length: 50 }, (_, k) => String(thisYear - k));
    return `<div class="ha-task" data-install="${item.id}">
      <label class="homey-form-label" style="margin-top:0">${esc(t('settings.install'))}</label>
      <div class="ha-grid3">
        <select class="homey-form-select inst-year"><option value="">${esc(t('pair.year'))}</option>${years.map(v => `<option ${v === y ? 'selected' : ''}>${v}</option>`).join('')}</select>
        <select class="homey-form-select inst-month"><option value="">${esc(t('pair.month'))}</option>${Array.from({ length: 12 }, (_, k) => pad(k + 1)).map(v => `<option value="${v}" ${v === m ? 'selected' : ''}>${esc(new Date(2026, Number(v) - 1, 1).toLocaleDateString(undefined, { month: 'long' }))}</option>`).join('')}</select>
        <button class="homey-button-secondary-small-shadow" data-act="install">${esc(t('settings.install_save'))}</button>
      </div></div>`;
  }

  function nameRow(item) {
    return `<div class="ha-task" data-namerow="${item.id}">
      <label class="homey-form-label" style="margin-top:0">${esc(t('settings.rename'))}</label>
      <div class="ha-grid2"><input class="homey-form-input item-name" type="text" maxlength="60" value="${esc(item.name)}" />
        <button class="homey-button-secondary-small-shadow" data-act="rename">${esc(t('usage.save'))}</button></div></div>`;
  }

  function linkRow(item) {
    const opts = homeyDevices
      ? homeyDevices.map(d => `<option value="${esc(d.id)}" ${item.link && item.link.id === d.id ? 'selected' : ''}>${esc(d.name)}${d.zone ? ` · ${esc(d.zone)}` : ''}</option>`).join('')
      : (item.link ? `<option value="${esc(item.link.id)}" selected>${esc(item.link.name)}</option>` : '');
    return `<div class="ha-task" data-linkrow="${item.id}">
      <label class="homey-form-label" style="margin-top:0">${esc(t('usage.linked_to'))}</label>
      <div class="ha-grid2">
        <select class="homey-form-select link-select"><option value="">${esc(t('usage.link_none'))}</option>${opts}</select>
        <button class="homey-button-secondary-small-shadow" data-act="link">${esc(t('usage.save'))}</button>
      </div></div>`;
  }

  // ---------- task editor (fields carry data-f; the draft is kept in `editing.draft`) ----------
  function draftFromTask(task, item) {
    const d = { ...task };
    if (task.type === 'usage' && task.source) {
      Object.assign(d, {
        metric: task.source.metric, srcCap: task.source.capability, op: task.source.condition && task.source.condition.op,
        cmpValue: task.source.condition && task.source.condition.value, offDelayMin: task.source.offDelayMin, minRunMin: task.source.minRunMin,
      });
    }
    return d;
  }

  function taskFromDraft(d, dev) {
    const task = { ...d };
    if (d.type === 'usage') {
      task.source = {
        capability: d.srcCap, metric: d.metric || 'hours', condition: { op: d.op || 'true', value: d.cmpValue },
        offDelayMin: Number(d.offDelayMin ?? 3), minRunMin: Number(d.minRunMin ?? 1), units: usageUnit(d, dev),
      };
    }
    ['metric', 'srcCap', 'op', 'cmpValue', 'offDelayMin', 'minRunMin', 'status', 'dueDate', 'days', 'progress', 'amountStatus'].forEach(k => delete task[k]);
    return task;
  }

  function dateFields(d) {
    const unitOpts = UNITS.map(u => `<option value="${u}" ${u === d.unit ? 'selected' : ''}>${esc(t('settings.units.' + u))}</option>`).join('');
    return `<label class="homey-form-label">${esc(t('settings.every'))}</label>
      <div class="ha-inline"><input class="homey-form-input" type="number" inputmode="numeric" min="1" data-f="every" value="${d.every ?? 1}" /><select class="homey-form-select" data-f="unit">${unitOpts}</select></div>
      <label class="homey-form-label">${esc(t('settings.lead'))}</label>
      <div class="ha-inline days"><input class="homey-form-input" type="number" inputmode="numeric" min="0" data-f="leadDays" value="${d.leadDays ?? 7}" /></div>
      <label class="homey-form-label">${esc(t('settings.last_done'))}</label>
      <input class="homey-form-input" type="date" data-f="lastDone" max="${today()}" value="${esc(d.lastDone || today())}" />`;
  }

  function usageFields(d, dev) {
    if (!dev) return `<p class="ha-sub" style="margin-top:12px">${esc(t('usage.no_link'))}</p>`;
    const metric = d.metric || 'hours';
    const metricOpts = ['hours', 'cycles', 'counter'].map(m => `<option value="${m}" ${m === metric ? 'selected' : ''}>${esc(t('usage.metric_' + m))}</option>`).join('');
    let source;
    if (metric === 'counter') {
      const caps = dev.capabilities.filter(c => c.type === 'number');
      source = `<label class="homey-form-label">${esc(t('usage.counter_cap'))}</label>
        <select class="homey-form-select" data-f="srcCap">${caps.map(c => `<option value="${esc(c.id)}" ${c.id === d.srcCap ? 'selected' : ''}>${esc(c.title)}${c.units ? ` (${esc(c.units)})` : ''} · ${esc(c.value ?? '–')}</option>`).join('')}</select>`;
    } else {
      const caps = dev.capabilities.filter(c => ['boolean', 'number', 'enum', 'string'].includes(c.type));
      const cap = capOf(dev, d.srcCap) || caps[0];
      let cond = '';
      if (cap && cap.type === 'number') {
        cond = `<div class="ha-inline days" style="margin-top:8px"><span>${esc(t('usage.greater_than'))}</span><input class="homey-form-input" type="number" inputmode="decimal" data-f="cmpValue" value="${esc(d.cmpValue ?? 10)}" style="width:90px" /><span>${esc(cap.units || '')}</span></div>`;
      } else if (cap && (cap.type === 'enum' || cap.type === 'string')) {
        const values = cap.values || [];
        cond = values.length
          ? `<select class="homey-form-select" style="margin-top:8px" data-f="cmpValue"><option value="">${esc(t('usage.equals'))}…</option>${values.map(v => `<option value="${esc(v.id)}" ${String(v.id) === String(d.cmpValue) ? 'selected' : ''}>${esc(t('usage.equals'))} ${esc(v.title)}</option>`).join('')}</select>`
          : `<input class="homey-form-input" style="margin-top:8px" type="text" data-f="cmpValue" placeholder="${esc(t('usage.equals'))}…" value="${esc(d.cmpValue ?? '')}" />`;
      }
      source = `<label class="homey-form-label">${esc(t('usage.running_when'))}</label>
        <select class="homey-form-select" data-f="srcCap">${caps.map(c => `<option value="${esc(c.id)}" ${cap && c.id === cap.id ? 'selected' : ''}>${esc(c.title)}${c.type === 'boolean' ? ` ${esc(t('usage.is_on'))}` : ''}</option>`).join('')}</select>
        ${cond}
        <label class="homey-form-label">${esc(t('usage.off_delay'))}</label>
        <div class="ha-inline days"><input class="homey-form-input" type="number" inputmode="numeric" min="0" data-f="offDelayMin" value="${d.offDelayMin ?? 3}" /><span>${esc(t('usage.minutes'))}</span></div>
        ${metric === 'cycles' ? `<label class="homey-form-label">${esc(t('usage.min_run'))}</label>
        <div class="ha-inline days"><input class="homey-form-input" type="number" inputmode="numeric" min="0" data-f="minRunMin" value="${d.minRunMin ?? 1}" /><span>${esc(t('usage.minutes'))}</span></div>` : ''}`;
    }
    return `<label class="homey-form-label">${esc(t('usage.metric'))}</label>
      <select class="homey-form-select" data-f="metric">${metricOpts}</select>
      ${source}
      ${describeSource(d, dev) ? `<p class="ha-sub" style="margin-top:8px">${esc(describeSource(d, dev))}${d.auto ? ` · ${esc(t('usage.auto'))}` : ''}</p>` : ''}
      <label class="homey-form-label">${esc(t('usage.threshold'))}</label>
      <div class="ha-inline days"><input class="homey-form-input" type="number" inputmode="decimal" min="0" data-f="threshold" value="${d.threshold ?? 100}" style="width:110px" /><span>${esc(usageUnit(d, dev))}</span></div>
      <label class="homey-form-label">${esc(t('usage.lead_percent'))}</label>
      <div class="ha-inline days"><input class="homey-form-input" type="number" inputmode="numeric" min="0" max="100" data-f="leadPercent" value="${d.leadPercent ?? 10}" /><span>%</span></div>
      <label class="homey-form-checkbox" style="margin-top:14px"><input class="homey-form-checkbox-input" type="checkbox" data-f="combine" ${d.combine ? 'checked' : ''} />
        <span class="homey-form-checkbox-checkmark"></span><span class="homey-form-checkbox-text">${esc(t('usage.also_date'))}</span></label>
      ${d.combine ? dateFields(d) : ''}`;
  }

  function editForm(d, item) {
    const dev = linkedDevice(item);
    const typeOpts = [['date', t('settings.type_date')], ['counter', t('settings.type_counter')]]
      .concat(item.link ? [['usage', t('usage.kind_usage')]] : [])
      .map(([v, l]) => `<option value="${v}" ${v === d.type ? 'selected' : ''}>${esc(l)}</option>`).join('');
    let fields;
    if (d.type === 'usage') fields = usageFields(d, dev);
    else if (d.type === 'counter') {
      fields = `<label class="homey-form-label">${esc(t('settings.threshold'))}</label>
        <input class="homey-form-input" type="number" inputmode="decimal" min="1" data-f="threshold" value="${d.threshold ?? 100}" />
        <label class="homey-form-label">${esc(t('settings.counter'))}</label>
        <input class="homey-form-input" type="number" inputmode="decimal" min="0" data-f="counter" value="${d.counter ?? 0}" />
        <label class="homey-form-label">${esc(t('settings.lead_percent'))}</label>
        <div class="ha-inline days"><input class="homey-form-input" type="number" inputmode="numeric" min="0" max="100" data-f="leadPercent" value="${d.leadPercent ?? 10}" /><span>%</span></div>`;
    } else fields = dateFields(d);
    return `<div class="ha-editor">
      <label class="homey-form-label">${esc(t('settings.name'))}</label>
      <input class="homey-form-input" type="text" data-f="name" value="${esc(d.name)}" maxlength="80" />
      <label class="homey-form-label">${esc(t('settings.type'))}</label>
      <select class="homey-form-select" data-f="type">${typeOpts}</select>
      ${fields}
      <label class="homey-form-label">${esc(t('settings.note'))}</label>
      <input class="homey-form-input" type="text" data-f="note" value="${esc(d.note || '')}" maxlength="500" />
      <div class="ha-actions">
        <button class="homey-button-primary-small-shadow" data-act="save">${esc(t('settings.save'))}</button>
        <button class="homey-button-transparent-small" data-act="cancel">${esc(t('settings.cancel'))}</button>
        ${editing && editing.taskId !== 'new' ? `<button class="homey-button-danger-small-shadow ha-right" data-act="delete">${esc(t('settings.delete'))}</button>` : ''}
      </div>
    </div>`;
  }

  // ---------- render ----------
  // Search: an item matches on its name, type, linked device or one of its tasks.
  function matches(item) {
    const words = query.toLowerCase().split(/\s+/).filter(Boolean);
    if (!words.length) return true;
    const text = [item.name, item.categoryName, item.link && item.link.name, ...item.tasks.map(tk => tk.name)].join(' ').toLowerCase();
    return words.every(w => text.includes(w));
  }

  function render() {
    if (!items.length) { $('items').innerHTML = `<div class="ha-card ha-pad ha-sub">${esc(t('settings.no_items'))}</div>`; return; }
    const shown = items.filter(matches);
    if (!shown.length) { $('items').innerHTML = `<div class="ha-card ha-pad ha-sub">${esc(t('settings.no_results', { query }))}</div>`; return; }
    $('items').innerHTML = shown.map(item => {
      const dev = linkedDevice(item);
      const cat = templates.find(c => c.id === item.category);
      const used = new Set(item.tasks.map(tk => tk.key).filter(Boolean));
      const suggestions = (cat ? cat.tasks : []).filter(tk => !used.has(tk.key));
      const worst = item.tasks.reduce((w, tk) => (ORDER.indexOf(tk.status) > ORDER.indexOf(w) ? tk.status : w), 'ok');
      const tasks = item.tasks.map(task => {
        const isEditing = editing && editing.itemId === item.id && editing.taskId === task.id;
        const bar = task.type === 'usage' || task.type === 'counter' ? `<div class="ha-bar"><span style="width:${Math.min(100, Math.round((task.progress || 0) * 100))}%"></span></div>` : '';
        return `<div class="ha-task" data-item="${item.id}" data-task="${task.id}">
          <div class="line"><span class="title">${esc(task.name)}</span>${stateIcon(task.status)}</div>
          <div class="meta">${esc(metaText(task, dev))}${task.note ? `<br>${esc(task.note)}` : ''}${task.history && task.history.length > 1 ? `<br>${esc(t('settings.history'))}: ${task.history.slice(1, 6).map(x => esc(fmt(x))).join(', ')}` : ''}</div>
          ${bar}
          ${isEditing ? editForm(editing.draft, item) : `<div class="ha-actions">
            <button class="homey-button-primary-small-shadow" data-act="done">${esc(t('settings.done'))}</button>
            <button class="homey-button-secondary-small-shadow" data-act="snooze">${esc(t('settings.snooze'))}</button>
            <button class="homey-button-secondary-small-shadow" data-act="edit">${esc(t('settings.edit'))}</button></div>`}
        </div>`;
      }).join('');
      const adding = editing && editing.itemId === item.id && editing.taskId === 'new';
      return `<div class="ha-card" data-item="${item.id}">
        <div class="ha-head">${icon(item.iconUri)}<div><div class="name">${esc(item.name)}</div><div class="ha-sub">${esc(item.categoryName)}${item.link ? ` · ${esc(item.link.name)}` : ''}</div></div>${item.tasks.length ? stateIcon(worst) : ''}</div>
        <div class="ha-task" style="padding-top:0;border-top:none"><button class="homey-button-transparent-small" style="padding-left:0" data-act="toggle-settings" data-id="${item.id}">${esc(t('settings.item_settings'))} ${openSettings.has(item.id) ? '▴' : '▾'}</button></div>
        ${openSettings.has(item.id) ? `${nameRow(item)}${installRow(item)}${linkRow(item)}
          <div class="ha-task"><button class="homey-button-danger-small-shadow" data-act="delete-item" data-id="${item.id}">${esc(t('settings.delete_item'))}</button></div>` : ''}
        ${tasks}
        <div class="ha-task" data-item="${item.id}" data-task="new">
          ${adding ? editForm(editing.draft, item) : `<select class="homey-form-select add-select">
            <option value="">+ ${esc(t('settings.add_task'))}</option>
            ${suggestions.map(tk => `<option value="tpl:${esc(tk.key)}">${esc(tk.name)}</option>`).join('')}
            <option value="custom">${esc(t('settings.custom'))}</option></select>`}
        </div>
      </div>`;
    }).join('') + `<div class="ha-card ha-legend">${ORDER.map(s => `<span>${stateIcon(s)}${esc(t('status.' + s))}</span>`).join('')}</div>`;
  }

  function replaceItem(list) { items = list; }

  async function save(item, tasks) {
    replaceItem(await api('PUT', `/items/${item.id}/tasks`, { tasks }));
    editing = null;
    render();
  }

  // ---------- events ----------
  async function onClick(ev) {
    const btn = ev.target.closest('[data-act]');
    if (!btn) return;
    try {
      if (btn.dataset.act === 'toggle-settings') {
        if (openSettings.has(btn.dataset.id)) openSettings.delete(btn.dataset.id); else openSettings.add(btn.dataset.id);
        render();
        return;
      }
      if (btn.dataset.act === 'rename') {
        const row = btn.closest('[data-namerow]');
        replaceItem(await api('PUT', `/items/${row.dataset.namerow}`, { name: row.querySelector('.item-name').value }));
        render(); H.alert(t('settings.saved'));
        return;
      }
      if (btn.dataset.act === 'delete-item') {
        if (!(await new Promise(res => H.confirm(t('settings.confirm_delete_item'), 'warning', (e, ok) => res(!e && ok))))) return;
        replaceItem(await api('DELETE', `/items/${btn.dataset.id}`));
        openSettings.delete(btn.dataset.id);
        render();
        return;
      }
      if (btn.dataset.act === 'install') {
        const row = btn.closest('[data-install]');
        const year = row.querySelector('.inst-year').value;
        const month = row.querySelector('.inst-month').value || '01';
        replaceItem(await api('PUT', `/items/${row.dataset.install}`, { installDate: year ? `${year}-${month}-01` : null }));
        render(); H.alert(t('settings.saved'));
        return;
      }
      if (btn.dataset.act === 'link') {
        const row = btn.closest('[data-linkrow]');
        const id = row.querySelector('.link-select').value;
        const dev = (homeyDevices || []).find(d => d.id === id);
        replaceItem(await api('PUT', `/items/${row.dataset.linkrow}`, { link: dev ? { id: dev.id, name: dev.name } : null }));
        render(); H.alert(t('settings.saved'));
        return;
      }
      const box = btn.closest('[data-task]');
      const item = items.find(i => i.id === box.dataset.item);
      const taskId = box.dataset.task;
      const task = item.tasks.find(tk => tk.id === taskId);
      switch (btn.dataset.act) {
        case 'done': replaceItem(await api('POST', `/items/${item.id}/tasks/${taskId}/done`, { date: today() })); render(); break;
        case 'snooze': replaceItem(await api('POST', `/items/${item.id}/tasks/${taskId}/snooze`, { days: 7 })); render(); break;
        case 'edit': editing = { itemId: item.id, taskId, draft: draftFromTask(task, item) }; render(); break;
        case 'cancel': editing = null; render(); break;
        case 'delete':
          if (!(await new Promise(res => H.confirm(t('settings.confirm_delete'), null, (e, ok) => res(!e && ok))))) break;
          await save(item, item.tasks.filter(tk => tk.id !== taskId)); break;
        case 'save': {
          const d = editing.draft;
          if (!String(d.name || '').trim()) { H.alert(t('errors.name_required')); break; }
          if (d.type === 'usage' && !d.srcCap) { H.alert(t('usage.no_link')); break; }
          const dev = linkedDevice(item);
          const newTask = taskFromDraft(d, dev);
          const tasks = editing.taskId === 'new' ? [...item.tasks, newTask] : item.tasks.map(tk => (tk.id === editing.taskId ? { ...tk, ...newTask } : tk));
          await save(item, tasks); break;
        }
        default:
      }
    } catch (err) { H.alert(err.message || String(err)); }
  }

  function onInput(ev) {
    const f = ev.target.dataset.f;
    if (!f || !editing || ev.target.tagName === 'SELECT' || ev.target.type === 'checkbox') return;
    editing.draft[f] = ev.target.value; // typing: keep focus
  }

  function onChange(ev) {
    const el = ev.target;
    const f = el.dataset.f;
    if (f && editing) {
      const d = editing.draft;
      d[f] = el.type === 'checkbox' ? el.checked : el.value;
      const item = items.find(i => i.id === editing.itemId);
      const dev = linkedDevice(item);
      if (f === 'type' && d.type === 'usage' && !d.srcCap) Object.assign(d, { combine: true }, autoSource(dev, d.metric || 'hours', 10));
      if (f === 'metric') Object.assign(d, autoSource(dev, d.metric, 10));
      if (['srcCap', 'cmpValue'].includes(f)) d.auto = false;
      if (f === 'srcCap') { const c = capOf(dev, d.srcCap); d.op = !c || c.type === 'boolean' ? 'true' : c.type === 'number' ? 'gt' : 'equals'; d.cmpValue = d.op === 'gt' ? 10 : ''; }
      if (['type', 'metric', 'srcCap', 'combine', 'unit'].includes(f)) render();
      return;
    }
    if (!el.classList.contains('add-select') || !el.value) return;
    const item = items.find(i => i.id === el.closest('[data-item]').dataset.item);
    let draft = { name: '', type: 'date', every: 3, unit: 'months', leadDays: 7, lastDone: today(), threshold: 100, leadPercent: 10 };
    if (el.value.startsWith('tpl:')) {
      const cat = templates.find(c => c.id === item.category);
      const tpl = cat.tasks.find(tk => tk.key === el.value.slice(4));
      draft = { ...draft, ...tpl };
      if (draft.basis === 'install' && item.installDate) draft.lastDone = item.installDate;
      if (tpl.usage && item.link) {
        Object.assign(draft, { type: 'usage', combine: true, threshold: tpl.usage.threshold, offDelayMin: 3, minRunMin: 1 }, autoSource(linkedDevice(item), tpl.usage.metric, tpl.usage.watts));
      }
    }
    editing = { itemId: item.id, taskId: 'new', draft };
    render();
  }

  function closeWizard() {
    $('wizard').classList.add('hidden');
    $('wizard').innerHTML = '';
    $('main').classList.remove('hidden');
    window.scrollTo(0, 0);
  }

  function openWizard() {
    $('main').classList.add('hidden');
    $('wizard').classList.remove('hidden');
    // eslint-disable-next-line no-undef
    MaintenanceWizard($('wizard'), {
      t, api, alert: msg => H.alert(msg),
      onDone: list => { items = list; closeWizard(); render(); },
      onCancel: closeWizard,
    });
  }

  async function load() {
    templates = await api('GET', '/templates');
    items = await api('GET', '/items');
    render();
    // The device list (for linking and usage) loads in the background.
    api('GET', '/homey-devices').then(list => { homeyDevices = list; render(); }).catch(err => console.log('Could not load devices', err));
  }

  function onHomeyReady(Homey) {
    H = Homey;
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    for (const key of ['notify_soon', 'notify_due', 'notify_overdue']) {
      H.get(key, (err, value) => { $(key).checked = value !== false; });
      $(key).addEventListener('change', () => H.set(key, $(key).checked));
    }
    H.get('overdue_after_days', (err, value) => { $('overdue_after_days').value = value || 7; });
    $('overdue_after_days').addEventListener('change', () => H.set('overdue_after_days', Math.max(1, Number($('overdue_after_days').value) || 7)));
    $('search').placeholder = t('settings.search');
    $('search').addEventListener('input', () => { query = $('search').value.trim(); render(); });
    $('items').addEventListener('click', onClick);
    $('addItem').addEventListener('click', openWizard);
    $('items').addEventListener('input', onInput);
    $('items').addEventListener('change', onChange);
    $('export').addEventListener('click', async () => {
      try { $('backup').value = JSON.stringify(await api('GET', '/export'), null, 2); } catch (err) { H.alert(err.message || String(err)); }
    });
    $('import').addEventListener('click', async () => {
      try {
        const res = await api('POST', '/import', { data: JSON.parse($('backup').value) });
        H.alert(t('settings.import_done', { restored: res.restored.join(', ') || '-', missing: res.missing.join(', ') || '-' }));
        await load();
      } catch (err) { H.alert(err.message || String(err)); }
    });
    load().catch(err => H.alert(err.message || String(err))).finally(() => H.ready());
  }
</script>
</body>
</html>
