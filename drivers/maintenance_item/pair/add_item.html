<style>
  .ha-steps { font-size: 13px; color: #888; margin-bottom: 4px; }
  .ha-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .ha-tile { border: 1px solid #ddd; border-radius: 10px; padding: 10px 4px; text-align: center; cursor: pointer; background: #fff; font-size: 13px; }
  .ha-tile .e { font-size: 26px; display: block; margin-bottom: 4px; }
  .ha-tile.sel { border-color: #2E8B6E; box-shadow: 0 0 0 2px #2E8B6E inset; }
  .ha-card { border: 1px solid #e3e3e3; border-radius: 10px; padding: 10px; margin: 8px 0; }
  .ha-card.off { opacity: .55; }
  .ha-card .head { display: flex; align-items: center; gap: 8px; font-weight: 500; }
  .ha-card .head input[type=text] { flex: 1; }
  .ha-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; margin-top: 8px; }
  .ha-fields label { font-size: 12px; color: #666; display: block; }
  .ha-fields .full { grid-column: 1 / -1; }
  .ha-fields input, .ha-fields select { width: 100%; box-sizing: border-box; }
  .ha-inline { display: flex; gap: 6px; }
  .ha-small { font-size: 13px; color: #666; }
  .ha-nav { display: flex; gap: 8px; margin-top: 14px; }
  .ha-nav button { flex: 1; }
  .ha-sum { padding: 6px 0; border-bottom: 1px solid #eee; }
  .ha-link { background: none; border: none; color: #2E8B6E; padding: 6px 0; cursor: pointer; font-size: 14px; }
  .hidden { display: none; }
</style>

<header class="homey-header">
  <div class="ha-steps" id="steps"></div>
  <h1 class="homey-title" id="title"></h1>
</header>

<div id="step1"><div class="ha-grid" id="cats"></div></div>

<div id="step2" class="hidden">
  <form class="homey-form" onsubmit="return false;">
    <div class="homey-form-group">
      <label class="homey-form-label" for="name" data-i18n="pair.name"></label>
      <input class="homey-form-input" id="name" type="text" maxlength="60" />
    </div>
    <div class="homey-form-group">
      <label class="homey-form-label" data-i18n="pair.install"></label>
      <div class="ha-inline">
        <select class="homey-form-select" id="year"></select>
        <select class="homey-form-select" id="month"></select>
      </div>
      <p class="ha-small" data-i18n="pair.install_hint"></p>
    </div>
  </form>
</div>

<div id="step3" class="hidden">
  <p class="ha-small" data-i18n="pair.tasks_hint"></p>
  <div id="tasks"></div>
  <button class="ha-link" id="addCustom" data-i18n="pair.add_custom"></button>
</div>

<div id="step4" class="hidden"><div id="summary"></div></div>

<div class="ha-nav">
  <button class="homey-button-secondary" id="back" data-i18n="pair.back"></button>
  <button class="homey-button-primary" id="next" data-i18n="pair.next"></button>
</div>

<script>
  const UNITS = ['days', 'weeks', 'months', 'years'];
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const tr = (k, v) => Homey.__(k, v);
  const pad = n => String(n).padStart(2, '0');
  const now = new Date();
  const today = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;

  let templates = [];
  let cat = null;
  let step = 1;
  let tasks = []; // working copy: { use, key, name, type, every, unit, leadDays, threshold, leadPercent, basis, last: 'install'|'today'|'date', lastDate, custom }

  // ---- date helpers (same rules as lib/schedule.js) ----
  function addInterval(date, every, unit) {
    const [y, m, d] = date.split('-').map(Number);
    if (unit === 'days' || unit === 'weeks') {
      const dt = new Date(Date.UTC(y, m - 1, d) + (unit === 'weeks' ? 7 : 1) * every * 86400000);
      return dt.toISOString().slice(0, 10);
    }
    const months = unit === 'years' ? every * 12 : every;
    const target = new Date(Date.UTC(y, m - 1 + months, 1));
    const last = new Date(Date.UTC(target.getUTCFullYear(), target.getUTCMonth() + 1, 0)).getUTCDate();
    target.setUTCDate(Math.min(d, last));
    return target.toISOString().slice(0, 10);
  }
  function installDate() {
    const y = $('year').value;
    if (!y) return null;
    const m = $('month').value || '01';
    const date = `${y}-${m}-01`;
    return date > today ? today : date;
  }
  function lastDoneOf(tk) {
    if (tk.last === 'install' && installDate()) return installDate();
    if (tk.last === 'date' && /^\d{4}-\d{2}-\d{2}$/.test(tk.lastDate || '') && tk.lastDate <= today) return tk.lastDate;
    return today;
  }
  function formatDate(date) {
    return new Date(`${date}T12:00:00`).toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' });
  }

  // ---- steps ----
  function show() {
    for (let i = 1; i <= 4; i++) $(`step${i}`).classList.toggle('hidden', i !== step);
    $('steps').textContent = tr('pair.step', { n: step });
    $('title').textContent = tr(`pair.s${step}_title`);
    $('back').classList.toggle('hidden', step === 1);
    $('next').textContent = tr(step === 4 ? 'pair.add' : 'pair.next');
    $('next').disabled = step === 1 && !cat;
    if (step === 3) renderTasks();
    if (step === 4) renderSummary();
  }

  function renderCats() {
    $('cats').innerHTML = templates.map(c => `<div class="ha-tile ${cat && cat.id === c.id ? 'sel' : ''}" data-id="${c.id}">
      <span class="e">${c.emoji || '🔧'}</span>${esc(c.name)}</div>`).join('');
  }

  function pickCategory(id) {
    const changed = !cat || cat.id !== id;
    cat = templates.find(c => c.id === id);
    if (changed) {
      $('name').value = cat.name;
      tasks = cat.tasks.map(tk => ({
        ...tk, use: true, threshold: 100, leadPercent: 10, last: tk.basis === 'install' ? 'install' : 'today', lastDate: today,
      }));
    }
    renderCats();
    step = 2;
    show();
  }

  function taskCard(tk, i) {
    const unitOpts = UNITS.map(u => `<option value="${u}" ${u === tk.unit ? 'selected' : ''}>${esc(tr('pair.units.' + u))}</option>`).join('');
    const counter = tk.type === 'counter';
    return `<div class="ha-card ${tk.use ? '' : 'off'}" data-i="${i}">
      <div class="head">
        <input type="checkbox" data-f="use" ${tk.use ? 'checked' : ''} />
        ${tk.custom ? `<input type="text" class="homey-form-input" data-f="name" placeholder="${esc(tr('pair.custom_name'))}" value="${esc(tk.name)}" />` : `<span>${esc(tk.name)}</span>`}
      </div>
      ${tk.use ? `<div class="ha-fields">
        <div class="full"><label>${esc(tr('pair.kind'))}</label>
          <select data-f="type"><option value="date" ${!counter ? 'selected' : ''}>${esc(tr('pair.kind_date'))}</option>
          <option value="counter" ${counter ? 'selected' : ''}>${esc(tr('pair.kind_counter'))}</option></select></div>
        ${counter ? `
          <div><label>${esc(tr('pair.threshold'))}</label><input type="number" min="1" data-f="threshold" value="${tk.threshold}" /></div>
          <div><label>${esc(tr('pair.lead_percent'))}</label><input type="number" min="0" max="100" data-f="leadPercent" value="${tk.leadPercent}" /></div>`
        : `
          <div><label>${esc(tr('pair.every'))}</label><input type="number" min="1" data-f="every" value="${tk.every}" /></div>
          <div><label>&nbsp;</label><select data-f="unit">${unitOpts}</select></div>
          <div><label>${esc(tr('pair.lead'))} (${esc(tr('pair.lead_days'))})</label><input type="number" min="0" data-f="leadDays" value="${tk.leadDays}" /></div>
          <div><label>${esc(tr('pair.last'))}</label><select data-f="last">
            ${installDate() ? `<option value="install" ${tk.last === 'install' ? 'selected' : ''}>${esc(tr('pair.last_install'))}</option>` : ''}
            <option value="today" ${tk.last === 'today' || (tk.last === 'install' && !installDate()) ? 'selected' : ''}>${esc(tr('pair.last_today'))}</option>
            <option value="date" ${tk.last === 'date' ? 'selected' : ''}>${esc(tr('pair.last_date'))}</option></select></div>
          ${tk.last === 'date' ? `<div class="full"><input type="date" data-f="lastDate" max="${today}" value="${esc(tk.lastDate)}" /></div>` : ''}`}
        ${tk.custom ? `<div class="full"><button class="ha-link" data-remove="${i}">${esc(tr('pair.remove'))}</button></div>` : ''}
      </div>` : ''}
    </div>`;
  }

  function renderTasks() {
    $('tasks').innerHTML = tasks.map(taskCard).join('');
  }

  function renderSummary() {
    const chosen = tasks.filter(tk => tk.use && String(tk.name).trim());
    const inst = installDate();
    let html = `<p><strong>${cat.emoji || ''} ${esc($('name').value)}</strong><br><span class="ha-small">${esc(tr('pair.install'))}: ${inst ? esc(formatDate(inst)) : esc(tr('pair.unknown'))}</span></p>`;
    if (!chosen.length) html += `<p class="ha-small">${esc(tr('pair.no_tasks_selected'))}</p>`;
    html += chosen.map(tk => {
      let due;
      if (tk.type === 'counter') due = `${esc(tr('pair.threshold'))}: ${tk.threshold}`;
      else {
        const d = addInterval(lastDoneOf(tk), Number(tk.every) || 1, tk.unit);
        due = `${esc(tr('pair.first_due'))}: ${d <= today ? `<strong>${esc(tr('pair.now'))}</strong>` : esc(formatDate(d))}`;
      }
      return `<div class="ha-sum">${esc(tk.name)}<br><span class="ha-small">${due}</span></div>`;
    }).join('');
    $('summary').innerHTML = html;
  }

  async function finish() {
    const chosen = tasks.filter(tk => tk.use && String(tk.name).trim()).map(tk => ({
      key: tk.custom ? null : tk.key,
      name: String(tk.name).trim(),
      type: tk.type,
      basis: tk.basis === 'install' ? 'install' : 'last',
      every: Number(tk.every) || 1,
      unit: tk.unit,
      leadDays: Number(tk.leadDays) || 0,
      threshold: Number(tk.threshold) || 100,
      leadPercent: Number(tk.leadPercent) || 10,
      lastDone: lastDoneOf(tk),
    }));
    $('next').disabled = true;
    try {
      const device = await Homey.emit('createItem', {
        name: $('name').value, category: cat.id, installDate: installDate(), tasks: chosen,
      });
      await Homey.createDevice(device);
      Homey.done();
    } catch (err) {
      Homey.alert(err.message || String(err));
      $('next').disabled = false;
    }
  }

  // ---- events ----
  $('cats').addEventListener('click', ev => {
    const tile = ev.target.closest('.ha-tile');
    if (tile) pickCategory(tile.dataset.id);
  });

  $('tasks').addEventListener('input', ev => {
    const card = ev.target.closest('.ha-card');
    const f = ev.target.dataset.f;
    if (!card || !f || ev.target.type === 'checkbox' || ev.target.tagName === 'SELECT') return;
    tasks[Number(card.dataset.i)][f] = ev.target.value; // typing: keep focus, no re-render
  });
  $('tasks').addEventListener('change', ev => {
    const card = ev.target.closest('.ha-card');
    const f = ev.target.dataset.f;
    if (!card || !f) return;
    const tk = tasks[Number(card.dataset.i)];
    tk[f] = ev.target.type === 'checkbox' ? ev.target.checked : ev.target.value;
    if (['use', 'type', 'last'].includes(f)) renderTasks();
  });
  $('tasks').addEventListener('click', ev => {
    const btn = ev.target.closest('[data-remove]');
    if (!btn) return;
    tasks.splice(Number(btn.dataset.remove), 1);
    renderTasks();
  });
  $('addCustom').addEventListener('click', () => {
    tasks.push({
      custom: true, use: true, key: null, name: '', type: 'date', every: 3, unit: 'months', leadDays: 7,
      threshold: 100, leadPercent: 10, basis: 'last', last: 'today', lastDate: today,
    });
    renderTasks();
  });

  $('back').addEventListener('click', () => { step = Math.max(1, step - 1); show(); });
  $('next').addEventListener('click', () => {
    if (step === 2 && !$('name').value.trim()) { Homey.alert(tr('errors.name_required')); return; }
    if (step === 4) { finish(); return; }
    step += 1;
    show();
  });

  (async () => {
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = tr(el.dataset.i18n); });
    $('name').placeholder = tr('pair.name_placeholder');
    const thisYear = now.getFullYear();
    $('year').innerHTML = `<option value="">${esc(tr('pair.unknown'))}</option>`
      + Array.from({ length: 50 }, (_, k) => thisYear - k).map(y => `<option value="${y}">${y}</option>`).join('');
    $('month').innerHTML = `<option value="">${esc(tr('pair.month'))}</option>`
      + Array.from({ length: 12 }, (_, k) => `<option value="${pad(k + 1)}">${esc(new Date(2026, k, 1).toLocaleDateString(undefined, { month: 'long' }))}</option>`).join('');
    templates = await Homey.emit('getTemplates');
    renderCats();
    show();
  })();
</script>
